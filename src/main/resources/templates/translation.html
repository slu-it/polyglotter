<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Polyglotter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <script src="../static/scripts/input-counter.js" th:src="@{/scripts/input-counter.js}"></script>
</head>
<body>
<main class="container">
    <div class="header">
        <img src="../static/images/logo.png" th:src="@{/images/logo.png}" alt="Logo"/>
        <h1>Polyglotter</h1>
    </div>
    <form method="post" th:action="@{/}" th:object="${form}">
        <div class="source-area">
            <div class="language-selection">
                <label for="sourceLanguage">Source</label>
                <select id="sourceLanguage" th:field="*{source}">
                    <option value="" selected>- Auto Detect -</option>
                    <option th:each="language : ${config.languages}"
                            th:value="${language}"
                            th:text="${language.displayName}">
                    </option>
                </select>
            </div>
            <div>
                <textarea id="input-text"
                          class="textarea"
                          placeholder="Enter the text to be translated here."
                          dir="auto"
                          th:field="*{text}"
                          th:attr="maxlength=${config.maxInputChars}"></textarea>
            </div>
            <div class="input-counter">
                <span id="input-count">0</span>
                <span>/</span>
                <span id="input-count-max" th:text="${config.maxInputChars}">500</span>
            </div>
        </div>
        <div class="translation-area">
            <div class="language-selection">
                <label for="targetLanguage">Translation</label>
                <select id="targetLanguage" th:field="*{target}">
                    <option th:each="language : ${config.languages}"
                            th:value="${language}"
                            th:text="${language.displayName}">
                    </option>
                </select>
            </div>
            <div>
                <textarea class="textarea"
                          placeholder="Click on 'Translate' to get a translation for the text you entered."
                          th:text="${result}"
                          th:attr="dir=${form.target.direction}, lang=${form.target.language}"
                          readonly></textarea>
            </div>
        </div>
        <div class="error-message" th:if="${error != null}" th:text="${error}">Oops</div>
        <div class="submit-area">
            <button type="submit">Translate</button>
        </div>
    </form>
</main>
</body>
</html>
