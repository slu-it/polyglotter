name: "pr-build"
run-name: "Building PR branch '${{ github.ref }}'."

on:
  pull_request:
    branches: [ "master" ]

concurrency:
  group: "pr-build-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
          gradle-version: wrapper
      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew clean build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'test-results'
          path: "build/reports/tests"
          retention-days: 7
